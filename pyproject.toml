[project]
name = "terminal-graphics-portfolio"
version = "1.0.0"
description = "Three impressive terminal-based visualizations demonstrating advanced algorithms and graphics techniques"
requires-python = ">=3.7"
authors = [
    {name = "Claude", email = "opus@anthropic.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "terminal",
    "graphics",
    "raymarching",
    "pathfinding",
    "physics",
    "ascii",
    "visualization",
    "algorithms"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Visualization",
]

# No runtime dependencies - uses only Python standard library!
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "black>=23.0.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
raymarcher = "raymarcher:main"
particle-universe = "particle_universe:main"
pathfinder-race = "pathfinder_race:main"

[project.urls]
Homepage = "https://github.com/yourusername/terminal-graphics"
Repository = "https://github.com/yourusername/terminal-graphics"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name (allow single-letter variables in math)
    "R0913",  # Too many arguments (physics functions need many params)
    "R0914",  # Too many local variables (acceptable in rendering functions)
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
